[connectivity]
# GROUP A â banks 0-3 share bundle hbm_a, all â HBM[0]
sp=new_quantum_noisy_kernel_4_1.bank0:HBM[0]
sp=new_quantum_noisy_kernel_4_1.bank1:HBM[0]
sp=new_quantum_noisy_kernel_4_1.bank2:HBM[0]
sp=new_quantum_noisy_kernel_4_1.bank3:HBM[0]

# GROUP B â banks 4-7 share bundle hbm_b, all â HBM[4]
sp=new_quantum_noisy_kernel_4_1.bank4:HBM[4]
sp=new_quantum_noisy_kernel_4_1.bank5:HBM[4]
sp=new_quantum_noisy_kernel_4_1.bank6:HBM[4]
sp=new_quantum_noisy_kernel_4_1.bank7:HBM[4]

# GROUP C â banks 8-11 share bundle hbm_c, all â HBM[8]

sp=new_quantum_noisy_kernel_4_1.bank9:HBM[8]
sp=new_quantum_noisy_kernel_4_1.bank10:HBM[8]
sp=new_quantum_noisy_kernel_4_1.bank11:HBM[8]

# GROUP D â banks 12-15 share bundle hbm_d, all â HBM[12]
sp=new_quantum_noisy_kernel_4_1.bank12:HBM[12]
sp=new_quantum_noisy_kernel_4_1.bank13:HBM[12]
sp=new_quantum_noisy_kernel_4_1.bank14:HBM[12]
sp=new_quantum_noisy_kernel_4_1.bank15:HBM[12]

# GROUP E â params share bundle hbm_e, all â HBM[16]
sp=new_quantum_noisy_kernel_4_1.gate_sequence:HBM[16]
sp=new_quantum_noisy_kernel_4_1.gate_params:HBM[16]
sp=new_quantum_noisy_kernel_4_1.noise_params:HBM[16]

[advanced]
param=compiler.addOutputTypes=hw_export
param=compiler.normalizeDefaultMemoryBanks=true

[vivado]
prop=run.impl_1.strategy=Congestion_SpreadLogic_high
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=1
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.MORE OPTIONS=-tns_cleanup
prop=run.synth_1.strategy=Flow_AreaOptimized_high
# Connectivity configuration for quantum_fpga_kernel_c128 on Alveo U55C
# 17 AXI masters: bank0..bank15 mapped to HBM, gmem0 (gate_sequence) to HBM bank 0
# Routing strategy: Congestion_SpreadLogic_high to mitigate 17-master congestion.
# See docs/DECISIONS.md D-01.

[connectivity]
nk=quantum_fpga_kernel_c128:1:krnl_c128

# HBM bank assignments (16 data banks + 1 gate sequence)
sp=krnl_c128.bank0:HBM[0]
sp=krnl_c128.bank1:HBM[1]
sp=krnl_c128.bank2:HBM[2]
sp=krnl_c128.bank3:HBM[3]
sp=krnl_c128.bank4:HBM[4]
sp=krnl_c128.bank5:HBM[5]
sp=krnl_c128.bank6:HBM[6]
sp=krnl_c128.bank7:HBM[7]
sp=krnl_c128.bank8:HBM[8]
sp=krnl_c128.bank9:HBM[9]
sp=krnl_c128.bank10:HBM[10]
sp=krnl_c128.bank11:HBM[11]
sp=krnl_c128.bank12:HBM[12]
sp=krnl_c128.bank13:HBM[13]
sp=krnl_c128.bank14:HBM[14]
sp=krnl_c128.bank15:HBM[15]
sp=krnl_c128.gmem0:HBM[0]

[vivado]
# High-effort congestion strategy for 17-master design
prop=run.impl_1.STRATEGY=Congestion_SpreadLogic_high
